services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    container_name: oraculo-graph-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DBNAME:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oraculo-graph-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: oraculo-graph-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (interface web)
      - "7687:7687"   # Bolt protocol (usado pelo driver Python)
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]   # já habilita GDS pra Fase 2
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_transaction_total_max=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oraculo-graph-api:latest
    container_name: oraculo-graph-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # order-sync-worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: oraculo-graph-api:latest
  #   container_name: oraculo-graph-order-sync-worker
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     - ENVIRONMENT=${ENVIRONMENT:-production}
  #     - REDIS_HOST=${REDIS_HOST:-redis}
  #     - DB_HOST=${DB_HOST:-postgres}
  #     - DB_PORT=${DB_PORT:-5432}
  #   # Periodic poller: syncs every active integration on a fixed interval.
  #   # No HTTP server in this container, so the image's baked-in HEALTHCHECK
  #   # (hits :8000/health) doesn't apply — disabled below.
  #   command: ["python", "-m", "app.features.order.sync_worker"]
  #   healthcheck:
  #     disable: true
  #   volumes:
  #     - ./app:/app/app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  order-sync-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: oraculo-graph-api:latest
    container_name: oraculo-graph-order-sync-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
    # Consumes integration.sync_requested events from Redis (published by
    # POST /integrations/{id}/sync) — without this running, that endpoint's
    # trigger sits in the stream unprocessed.
    command: ["python", "-m", "app.features.order.sync_consumer"]
    healthcheck:
      disable: true
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_backups: