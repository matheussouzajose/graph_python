[project]
name = "rag"
version = "0.1.0"
description = "Media Engine API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Matheus Souza Jose", email = "matheussouzajose97@gmail.com"}
]
keywords = [
    "software engineering",
    "api application",
    "langchain application",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.2.6",
    "openai>=2.46.0",
    "redis>=8.0.1",
    "cryptography>=46.0.4",
    "langchain>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.1.1",
    "langgraph-cli[inmem]>=0.0.20",
    "PyJWT>=2.12.0",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "psycopg[binary,pool]>=3.3.4",
    "pytz>=2026.2",
    "structlog>=25.5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "pysrt>=1.1.2",
    "python-frontmatter>=1.3.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-postgres>=0.0.17",
    "psycopg2-binary>=2.9.12",
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "langchain-neo4j>=0.10.0",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=26.3.1",
    "colorama>=0.4.6",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# app/engine is vendored code (viral_cutter_v3) — kept as-is
extend-exclude = ["app/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Helpers do FastAPI usados como default de parâmetro (padrão do framework) —
# não são mutáveis compartilhados, então não devem disparar B008.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["app/engine"]
