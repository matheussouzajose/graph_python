services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: oraculo-graph-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DBNAME:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oraculo-graph-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: oraculo-graph-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol (driver Python)
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science","apoc"]
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_transaction_total_max=2G
      # Community Edition não tem RBAC/usuário read-only de verdade, então a
      # via GLOBAL do Graph RAG (Cypher gerado pelo LLM, ver rag/cypher_qa.py)
      # roda com o mesmo usuário admin — este timeout é a defesa de fato
      # contra uma query gerada sem WHERE (full scan) travando/consumindo
      # recursos em produção.
      - NEO4J_dbms_transaction_timeout=30s
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    image: registry.msouzajose.tech/oraculo-graph-api:${IMAGE_TAG:-latest}
    # `latest` é tag móvel: sem isto, `up -d` reusa a imagem local cacheada e
    # sobe código antigo. `always` força o pull da tag a cada `up`.
    pull_policy: always
    container_name: oraculo-graph-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    image: registry.msouzajose.tech/oraculo-graph-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: oraculo-graph-frontend
    restart: unless-stopped
    expose:
      - "4173"
    depends_on:
      api:
        condition: service_started

  # Consome `integration.sync_requested` do Redis Stream (publicado por
  # POST /integrations/{id}/sync) — sem este serviço rodando, esse endpoint
  # aceita o request (202) mas a sincronização nunca é processada.
  order-sync-consumer:
    image: registry.msouzajose.tech/oraculo-graph-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: oraculo-graph-order-sync-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
    command: ["python", "-m", "app.features.order.sync_consumer"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # Poller periódico: a cada `poll_interval` (ver order/sync_worker.py),
  # sincroniza todas as integrações ativas do zero/checkpoint, sem depender
  # de um trigger manual ou de evento — é o que mantém os pedidos frescos em
  # produção sem intervenção.
  order-sync-worker:
    image: registry.msouzajose.tech/oraculo-graph-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: oraculo-graph-order-sync-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
    command: ["python", "-m", "app.features.order.sync_worker"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:
